歧对立关联",group:"核心教学取向之争",from:"杜威（儿童中心 / 经验课程）",to:"要素主义（Bagley）与永恒主义（Hutchins）",chain:[],typeText:"分歧对立关联",point:'一方主张课程围绕儿童兴趣与经验组织；另一方主张以系统学科知识与经典文本为轴，认为儿童中心取向削弱学术标准。核心分歧在于"课程组织的逻辑起点是儿童还是学科"。'},{id:"D047",type:"disagreement",typeLabel:"分歧对立关联",group:"核心教学取向之争",from:"探究式教学",to:"直接教学",chain:[],typeText:"分歧对立关联",point:'一方认为探究培养科学思维与自主性；另一方指出探究对先备知识薄弱学生尤其不利，可能扩大而非缩小差距。核心分歧在于"教学方法的公平性效应方向"。'},{id:"D048",type:"disagreement",typeLabel:"分歧对立关联",group:"核心教学取向之争",from:"学习风格匹配教学",to:"认知心理学主流（Pashler et al. 等）",chain:[],typeText:"分歧对立关联",point:'教育实践广泛主张按视觉/听觉/动觉偏好匹配教学；认知心理学研究指出交互效应检验未获支持。核心分歧在于"匹配假说是否存在可重复的实证基础"。'},{id:"D049",type:"disagreement",typeLabel:"分歧对立关联",group:"发展与心理机制之争",from:"皮亚杰（阶段论）",to:"西格勒（重叠波模型 / 信息加工发展观）",chain:[],typeText:"分歧对立关联",point:'一方认为发展经质变阶段推进，阶段顺序不变；另一方认为发展是策略池竞争与渐进优化的连续过程，阶段划分掩盖了个体内变异。核心分歧在于"发展是否存在质变阶段"。'},{id:"D050",type:"disagreement",typeLabel:"分歧对立关联",group:"发展与心理机制之争",from:"皮亚杰（认知发展普遍性）",to:"维果茨基（社会文化决定论）",chain:[],typeText:"分歧对立关联",point:'一方以个体—环境平衡化为发展机制并主张阶段跨文化普遍；另一方认为高级心理机能由社会互动与符号中介塑造，发展的方向与速度系于文化工具。核心分歧在于"发展的动力在个体内部的建构还是在社会互动的内化"。'},{id:"D051",type:"disagreement",typeLabel:"分歧对立关联",group:"发展与心理机制之争",from:"皮亚杰（自我中心言语为不成熟标志）",to:"维果茨基（自我言语为自我调节工具）",chain:[],typeText:"分歧对立关联",point:'皮亚杰视幼儿自我中心言语为认知不成熟的残余；维果茨基视其为社会言语内化为内部言语的中间形态，是自我调节的起点。核心分歧在于"自我言语的性质与功能"。'},{id:"D052",type:"disagreement",typeLabel:"分歧对立关联",group:"发展与心理机制之争",from:"鲍尔比 / 安斯沃斯（依恋稳定性）",to:"卡根（气质优先说）",chain:[],typeText:"分歧对立关联",point:'一方认为依恋模式反映照护关系史并具跨时间稳定性；另一方认为婴儿气质差异被系统低估，依恋分类部分是对气质的行为编码。核心分歧在于"依恋模式的成因是关系经验还是个体气质"。'},{id:"D053",type:"disagreement",typeLabel:"分歧对立关联",group:"发展与心理机制之争",from:"科尔伯格（道德推理核心论）",to:"海特（社会直觉模型）",chain:[],typeText:"分歧对立关联",point:'一方认为道德判断以可评估的推理结构为核心并依阶段发展；另一方认为判断先由快速直觉产生，推理承担事后合理化。核心分歧在于"道德判断的因果顺序"。'},{id:"D054",type:"disagreement",typeLabel:"分歧对立关联",group:"发展与心理机制之争",from:"科尔伯格（公正伦理）",to:"吉利根（关怀伦理）",chain:[],typeText:"分歧对立关联",point:'一方以权利与公正为最高道德取向；另一方认为关怀与责任构成另一同等有效的道德声音，被前者的阶段框架系统性贬低。核心分歧在于"道德成熟是否只有单一取向标准"。'},{id:"D055",type:"disagreement",typeLabel:"分歧对立关联",group:"发展与心理机制之争",from:"依恋（关键窗口假设）",to:"依恋可塑性研究（如 Sroufe 与后续追踪）",chain:[],typeText:"分歧对立关联",point:'一方强调早期依恋的长程决定作用；另一方指出跨时间稳定性仅中等，后续照护环境变化可显著重塑依恋表征。核心分歧在于"早期经验的不可逆程度"。'},{id:"D056",type:"disagreement",typeLabel:"分歧对立关联",group:"动机、奖励与自我之争",from:"斯金纳（强化论）",to:"自我决定理论（Deci & Ryan）",chain:[],typeText:"分歧对立关联",point:'一方认为强化物中性，奖励只提高行为频率；另一方认为预期性外在奖励通过降低自主感削弱内在动机。核心分歧在于"外在奖励是否具有动机的破坏性效应"。'},{id:"D057",type:"disagreement",typeLabel:"分歧对立关联",group:"动机、奖励与自我之争",from:"斯金纳（操作性强化）",to:"乔姆斯基（语言先天论）",chain:[],typeText:"分歧对立关联",point:'一方认为语言行为由强化史塑造，可按操作性原理分析；另一方以刺激贫乏论证与生成性为依据，主张语言能力为先天普遍语法结构。核心分歧在于"复杂行为能否被强化框架完全解释"。'},{id:"D058",type:"disagreement",typeLabel:"分歧对立关联",group:"动机、奖励与自我之争",from:"行为主义（Watson / Skinner）",to:"人本主义（Rogers / Maslow）",chain:[],typeText:"分歧对立关联",point:'一方以可观察行为为唯一研究单位，主张环境塑造与控制；另一方以自我实现与内在价值为核心，主张人的主动成长倾向。核心分歧在于"行为控制与人的自主性的关系"。'},{id:"D059",type:"disagreement",typeLabel:"分歧对立关联",group:"动机、奖励与自我之争",from:"班杜拉（三元交互决定论）",to:"行为主义（一元环境决定论）",chain:[],typeText:"分歧对立关联",point:'一方认为行为由环境刺激直接决定；另一方认为个体因素（认知、效能信念）与环境、行为互为因果。核心分歧在于"环境决定论的解释充分性"。'},{id:"D060",type:"disagreement",typeLabel:"分歧对立关联",group:"动机、奖励与自我之争",from:"自我决定理论（内在动机优先）",to:"行为分析（外在强化有效）",chain:[],typeText:"分歧对立关联",point:'在教育实践上表现为"是否应使用奖励系统"的冲突：一方主张奖励破坏自主；另一方以元分析指出奖励在技能建立阶段具有稳定效能，削弱效应仅在特定条件成立。核心分歧在于"奖励效应的适用边界"。'},{id:"D061",type:"disagreement",typeLabel:"分歧对立关联",group:"动机、奖励与自我之争",from:"天赋论（专长由才能决定）",to:"刻意练习理论（Ericsson）",chain:[],typeText:"分歧对立关联",point:'一方认为专长受先天才能与认知禀赋制约；另一方认为刻意练习数量是专长的关键决定因素。核心分歧在于"刻意练习对成就差异的解释力边界"（后续研究显示练习解释方差约为四分之一）。'},{id:"D062",type:"disagreement",typeLabel:"分歧对立关联",group:"教育制度与技术之争",from:"人力资本理论（Schultz / Becker）",to:"筛选假说与信号理论（Spence / Arrow）",chain:[],typeText:"分歧对立关联",point:'一方认为教育提高生产力从而提高收入；另一方认为教育文凭主要传递既有能力信号，生产力提升有限。核心分歧在于"教育收益率反映的是生产力效应还是筛选效应"。'},{id:"D063",type:"disagreement",typeLabel:"分歧对立关联",group:"教育制度与技术之争",from:"功能主义教育社会学（Durkheim / Parsons）",to:"冲突论（Bowles & Gintis）",chain:[],typeText:"分歧对立关联",point:'一方认为学校承担社会化与社会整合的正功能；另一方认为学校再生产阶级结构与劳动力分层。核心分歧在于"学校在结构不平等中的角色"。'},{id:"D064",type:"disagreement",typeLabel:"分歧对立关联",group:"教育制度与技术之争",from:"文化再生产（Bourdieu）",to:"反抗理论（Willis）",chain:[],typeText:"分歧对立关联",point:'一方强调结构通过文化资本与惯习稳定复制；另一方强调被支配群体的能动反抗与"反学校文化"的自主性。核心分歧在于"结构决定的强度与个体能动性的空间"。'},{id:"D065",type:"disagreement",typeLabel:"分歧对立关联",group:"教育制度与技术之争",from:"教育技术增益论",to:"技术效应稀释论（如 OECD PISA 数字设备研究）",chain:[],typeText:"分歧对立关联",point:'一方认为技术可提升个性化与可及性；另一方发现设备使用频率与阅读成绩呈负相关或零相关，指出效应取决于教学法而非设备。核心分歧在于"技术本身的独立效应是否存在"。'},{id:"D066",type:"disagreement",typeLabel:"分歧对立关联",group:"教育制度与技术之争",from:"神经科学指导教学（MBE）",to:"桥接过度推论批判（Bruer）",chain:[],typeText:"分歧对立关联",point:'一方主张脑科学证据可指导教学实践；另一方认为神经科学层面证据与课堂层面教学决策之间缺少可对接的中间层，直接转化多为过度解读。核心分歧在于"跨层级证据的可迁移性"。'},{id:"D067",type:"disagreement",typeLabel:"分歧对立关联",group:"教育制度与技术之争",from:"关键期理论（Lenneberg）",to:"敏感期 / 可塑性研究",chain:[],typeText:"分歧对立关联",point:'一方主张语言与依恋发展存在不可逆的时间窗口；另一方认为多数发展窗口为敏感期而非关键期，后期干预仍可产生实质改善。核心分歧在于"发展时间窗口的不可逆程度"。'},{id:"D068",type:"disagreement",typeLabel:"分歧对立关联",group:"心理测量与差异之争",from:"智力一般因素论（Spearman）",to:"多元智能理论（Gardner）",chain:[],typeText:"分歧对立关联",point:'一方以因素分析证据主张存在一般智力 g；另一方主张智能为相互独立的多种类型。核心分歧在于"认知能力的结构是层级统一的还是模块独立的"。'},{id:"D069",type:"disagreement",typeLabel:"分歧对立关联",group:"心理测量与差异之争",from:"智力的一般因素论",to:"智力三层级理论（Carroll / CHC）",chain:[],typeText:"分歧对立关联",point:'前者主张单一 g 为核心，后者以大规模因素分析指出层级结构（一般—广域—窄域）更为恰当。核心分歧在于"g 的充分性与层级结构的必要性"。'},{id:"D070",type:"disagreement",typeLabel:"分歧对立关联",group:"心理测量与差异之争",from:"学习风格理论",to:"认知能力取向",chain:[],typeText:"分歧对立关联",point:'一方主张按偏好通道施教；另一方主张以认知能力与先备知识为解释变量，风格无差异化教学效度。核心分歧在于"个体差异应如何界定与测量"。'},{id:"D071",type:"disagreement",typeLabel:"分歧对立关联",group:"心理测量与差异之争",from:"全纳教育（萨拉曼卡宣言）",to:"能力分轨 / 特殊班设置实践",chain:[],typeText:"分歧对立关联",point:'一方主张所有儿童在普通班级接受教育；另一方主张对特定特殊需要儿童而言，专门化设置能提供更充分支持。核心分歧在于"安置形式与教育质量的关系"。'},{id:"D072",type:"disagreement",typeLabel:"分歧对立关联",group:"心理测量与差异之争",from:"神经多样性范式（Singer）",to:"医学模式（缺陷—矫正取向）",chain:[],typeText:"分歧对立关联",point:'一方主张神经差异为正常人类变异，应以支持与适应环境为目标；另一方将差异视为需干预的障碍。核心分歧在于"干预目标应设定为消除差异还是增强功能与改善环境"。'},{id:"D073",type:"disagreement",typeLabel:"分歧对立关联",group:"脑科学与教育的解释之争",from:"关键期强决定论",to:"终身神经可塑性",chain:[],typeText:"分歧对立关联",point:'一方主张特定功能存在不可逆的时间窗，错过后干预效果锐减；另一方以突触可塑贯穿一生的证据主张门槛升高而非窗口关闭。核心分歧在于"可塑性的时间结构是硬关闭还是递减"。'},{id:"D074",type:"disagreement",typeLabel:"分歧对立关联",group:"脑科学与教育的解释之争",from:"左右脑分工与学习风格等神经神话",to:"认知神经科学与教学研究证据",chain:[],typeText:"分歧对立关联",point:'一方以"优势半球""通道偏好"为教学依据；另一方指出相关主张缺乏差异教学效度证据，多数属于对脑研究的误读。核心分歧在于"脑科学结论能否直接转译为教学处方"。'},{id:"D075",type:"disagreement",typeLabel:"分歧对立关联",group:"脑科学与教育的解释之争",from:"双语认知优势假说",to:"语言习得敏感期模型",chain:[],typeText:"分歧对立关联",point:'一方主张双语经验带来执行功能优势；另一方指出该优势在控制社会经济地位与发表偏差后大幅缩小，且晚期习得的语音与语法难以达到母语水平。核心分歧在于"双语经验的可迁移收益有多大、在什么条件下成立"。'},{id:"D076",type:"disagreement",typeLabel:"分歧对立关联",group:"脑科学与教育的解释之争",from:"镜像神经元与共情解释",to:"心智理论模块论",chain:[],typeText:"分歧对立关联",point:'一方以镜像机制解释动作理解与共情；另一方认为心智理论依赖独立的推理系统与领域特异加工，镜像机制不足以承担信念归因。核心分歧在于"社会理解是模拟还是推理"。'},{id:"D077",type:"disagreement",typeLabel:"分歧对立关联",group:"脑科学与教育的解释之争",from:"催产素社会联结假说",to:"社会行为的情境—个体差异模型",chain:[],typeText:"分歧对立关联",point:'一方把催产素视为亲社会激素；另一方以元分析证据指出其效应量小、方向受情境与个体差异调节，部分早期结果未能重复。核心分歧在于"单一神经调质能否解释复杂社会行为"。'},{id:"D078",type:"disagreement",typeLabel:"分歧对立关联",group:"脑科学与教育的解释之争",from:"青少年脑发育双系统模型",to:"单一认知控制系统模型",chain:[],typeText:"分歧对立关联",point:'一方以奖赏系统与控制系统的发展时程差异解释风险行为峰值；另一方认为认知控制的线性增长即可解释，且风险行为的年龄曲线跨文化差异显著。核心分歧在于"是否需要两个系统才能解释青少年行为"。'},{id:"D079",type:"disagreement",typeLabel:"分歧对立关联",group:"脑科学与教育的解释之争",from:"阅读障碍的语音缺陷假说",to:"视觉大细胞与多重缺陷假说",chain:[],typeText:"分歧对立关联",point:'一方将核心缺陷定位于语音表征与语音—字形映射；另一方主张视觉大细胞通路、快速序列加工等缺陷同样构成基础，单一缺陷难以覆盖全部亚型。核心分歧在于"核心缺陷是单一的还是异质的"。'},{id:"L080",type:"lineage",typeLabel:"衍生发展关联",group:"衍生发展关联（Lineage Connections）",from:"巴甫洛夫（经典条件反射）",to:"斯金纳（操作性条件反射）",chain:["巴甫洛夫（经典条件反射）","华生（行为主义）","斯金纳（操作性条件反射）"],typeText:"衍生发展关联",point:"经典条件反射提供刺激联结的机制，华生将其扩展为心理学方法论纲领，斯金纳以操作性行为与强化程序重构了行为控制原理，完成从被动反射到主动操作的转变。"},{id:"L081",type:"lineage",typeLabel:"衍生发展关联",group:"衍生发展关联（Lineage Connections）",from:"桑代克（效果律）",to:"代币制与 SWPBIS",chain:["桑代克（效果律）","斯金纳（强化原理）","代币制与 SWPBIS"],typeT 优于集中练习；检索练习优于重复阅读。",kind:"agreement",note:"间隔效应与测试效应在多种材料、年龄与学科中重复出现，是学习科学中最稳健的结论之一。它们通过增加提取努力与遗忘后的重建来增强长期保持。",entries:["P12","P11"],figures:["塞西","罗迪格","卡皮克"]},{text:"工作记忆容量有限，是教学设计必须尊重的硬约束。",kind:"agreement",note:"容量限制决定了分块、减少外在负荷、自动化基础技能的必要性。认知负荷理论据此区分内在、外在与相关负荷，并给出多媒体设计原则。",entries:["P10","P3","B4"],figures:["巴德利","斯威勒"]},{text:"师生关系质量与学业及社会情绪结果稳定正相关。",kind:"agreement",note:"关系质量通过参与、求助意愿与情绪安全起作用；平均效应中等，但在高风险学生中更大。冲突与依赖型关系则与更差的结果相关。",entries:["P55","B85","P74"],figures:["皮安塔","哈蒂"]},{text:"家庭社会经济地位与学业成就的相关性在国际样本中高度稳定。",kind:"agreement",note:"相关稳定不等于因果。物质剥夺、慢性压力、认知刺激投资与邻里资源是主要中介；收入自然实验显示部分差距可被政策缩小。",entries:["C60","E66","E65"],figures:["科尔曼","邓肯","马格努森"]},{text:"形成性评价对学习增益大于单纯总结性评价。",kind:"agreement",note:"核心机制是用证据调整教学，而非增加考试次数。效应依赖实施质量；高利害总结性评价会挤压形成性实践的空间。",entries:["E53","E54","E51"],figures:["布莱克","威廉姆"]},{text:"依恋安全性对儿童社会情绪适应有稳定预测力。",kind:"agreement",note:"预测力中等，且受后续关系与压力事件调节。安全依恋与更好的情绪调节、同伴关系与学校适应相关，但并非不可改变。",entries:["C3","C17","C38"],figures:["鲍尔比","安斯沃斯","范艾森多恩"]},{text:"语言输入的丰富度与儿童词汇发展存在剂量—效应关系。",kind:"agreement",note:"词数与互动质量都重要：对话轮次、回应性与共同注意比单纯词数更能预测语言增长。屏幕的单向输入不能替代真人互动。",entries:["C13","B55","C72"],figures:["哈特","里斯利","库尔"]},{text:"教师期望通过互动行为传递并影响学生表现（效应存在争议但机制成立）。",kind:"agreement",note:"机制包括等待时间、反馈内容、提问难度与机会分配。平均效应较小，且多数教师期望是准确的；负面期望的危害比正面期望的收益更稳定。",entries:["P74","E64"],figures:["罗森塔尔","雅各布森","贾西姆"]},{text:"元认知能力可训练，且与学业成就正相关。",kind:"agreement",note:"策略教学有效，但迁移有限，需结合具体学科内容与反思习惯。单纯开设「学习方法课」通常不如嵌入学科的策略训练。",entries:["P9","P40","E41"],figures:["弗拉维尔","齐默尔曼","迪格纳特"]},{text:"教师专业发展需长期、持续、聚焦课堂，而非一次性培训。",kind:"agreement",note:"协作、课堂观察与反馈循环是关键机制；短期讲座对实践改变有限。专业学习共同体与带教制度的证据优于孤立工作坊。",entries:["E84","E86","E82"],figures:["杜福尔","英格索尔","钦纳-莫兰"]},{text:"阶段论 vs 连续论：认知发展是否为质变式阶段推进。",kind:"disagreement",note:"判断依赖测量粒度：任务简化时看到阶段，微观追踪时看到渐进更替。阶段主张需要结构重组的证据，而非仅有水平差异。教育上宜按能力而非阶段标签设计。",entries:["C80","C8","C1"],figures:["皮亚杰","西格勒","布雷纳德"]},{text:"关键期 vs 敏感期：语言与依恋是否存在不可逆的时间窗口。",kind:"disagreement",note:"多数证据支持「敏感期」而非绝对关键期：窗口后学习更难但并非不可能。语音知觉的窗口较陡，句法与词汇的窗口更平缓。",entries:["B2","B14","C68"],figures:["胡贝尔","维泽尔","库尔"]},{text:"直接教学 vs 建构/探究教学：何者对新手更有效、对何者更公平。",kind:"disagreement",note:"对新手与基础知识，指导性教学更稳；对已具备先备知识者，有指导的探究能促进迁移。争论常把「最少指导」与「有指导的探究」混为一谈。",entries:["E36","E37","P30"],figures:["罗森夏因","基尔施纳","斯威勒"]},{text:"学习风格匹配教学：是否存在实证支持（主流研究倾向否证）。",kind:"disagreement",note:"「视觉型／听觉型」匹配缺乏稳定证据：偏好存在，但按偏好教学不提升成绩。应区分学习偏好与能力，提供多种表征而非按类型分组。",entries:["B20","P58","P62"],figures:["帕什勒","威林厄姆"]},{text:"屏幕时间效应：是独立风险因素还是家庭环境混淆变量。",kind:"disagreement",note:"总时长与结果的关联较弱；内容、使用情境与睡前使用更关键，且存在反向因果（注意力弱的儿童更早更多使用屏幕）。",entries:["C64","B24","G35"],figures:["克里斯塔基斯","马迪根"]},{text:"双语认知优势：是否存在稳定的执行功能优势。",kind:"disagreement",note:"早期执行功能优势的效应量小、复现不稳，受移民背景与教育水平混淆。双语在语言意识、元语言知识与跨文化理解上另有收益。",entries:["B56","C73","C68"],figures:["比亚韦斯托克","帕斯夸尔"]},{text:"道德发展普遍性：科尔伯格阶段框架是否文化偏误。",kind:"disagreement",note:"科尔伯格阶段存在样本与性别偏差；后续元分析显示男女差异很小。领域理论进一步显示道德、习俗与个人事务的区分更跨文化稳定。",entries:["C29","C27","C5"],figures:["科尔伯格","图列尔","吉利根"]},{text:"天赋 vs 练习：专长形成中刻意练习的解释力边界。",kind:"disagreement",note:"刻意练习是必要非充分条件；元分析显示其解释力因领域而异。起点能力、教练质量、机会与动机同样重要。",entries:["P30","C49","E46"],figures:["埃里克森","麦克纳马拉"]},{text:"智力可塑性与测验公平：IQ 的实际可塑幅度与用途边界。",kind:"disagreement",note:"训练多提升受训任务，远迁移有限；测验存在文化偏差，分数应带误差区间解释。智商是相对位置，不是能力上限。",entries:["P59","P76","P84"],figures:["斯皮尔曼","加德纳","弗林"]},{text:"教育技术效应量：技术本身的增益是否被高估。",kind:"disagreement",note:"技术本身的平均效应小且不稳定；设计、教师整合与使用情境解释大部分变异。技术会放大原有教学取向，而非自动改变它。",entries:["G31","G34","G40"],figures:["库利克","梅恩斯"]},{text:"依恋类型稳定性：是否随环境变化而重塑。",kind:"disagreement",note:"类型具有中等稳定性，但相当比例会改变；后续关系质量、压力事件与照护稳定性是主要预测因素。分类不应被当作固定标签。",entries:["C17","C38","C37"],figures:["沃特斯","范艾森多恩","弗里利"]},{text:"神经科学能否指导教学：桥梁研究的有效性与过度解读风险。",kind:"disagreement",note:"脑成像提供约束而非教学处方。反向推理、实验室任务与课堂任务的生态差异，使「基于脑的教学」常被过度解读。",entries:["B93","B91","B97"],figures:["布鲁尔","波尔德拉克"]}]},meta:{entryCount:454,domains:["教育学基础理论","教育行为心理学","泛教育理论","儿童成长与发展","脑科学与学习"],entriesByDomain:{"教育学基础理论":100,"教育行为心理学":85,"泛教育理论":80,"儿童成长与发展":89,"脑科学与学习":100}}};const NAV=DATA.nav||{},CONN=DATA.connections||{};const META=DATA.meta||
