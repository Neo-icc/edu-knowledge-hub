<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教育与心智 · 知识图谱</title>
<meta name="description" content="教育与心智知识图谱：同一入口，三种身份。家长与老师走情境优先，研究者与学者走研究索引。">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    var s = null;
    try { s = localStorage.getItem("hub-theme"); } catch (e) {}
    var t = s === "dark" || s === "light" ? s : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    --bg: oklch(97% 0.008 75);
    --bg2: oklch(94% 0.012 75);
    --paper: oklch(99% 0.004 85);
    --ink: oklch(20% 0.018 75);
    --ink2: oklch(36% 0.016 75);
    --ink3: oklch(46% 0.016 75);
    --ink5: oklch(58% 0.016 75);
    --rule: oklch(88% 0.016 75);
    --rule2: oklch(80% 0.016 75);
    --accent: oklch(44% 0.155 30);
    --accent-ink: oklch(99% 0.005 85);
    --derive: oklch(46% 0.11 252);
    --serif: "Fraunces", "Noto Serif SC", "Songti SC", Georgia, serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    --shadow: 0 4px 18px oklch(20% 0.02 75 / 0.08), 0 2px 6px oklch(20% 0.02 75 / 0.05);
  }
  html[data-theme="dark"] {
    --bg: oklch(19% 0.010 75);
    --bg2: oklch(23% 0.012 75);
    --paper: oklch(26% 0.012 75);
    --ink: oklch(92% 0.008 85);
    --ink2: oklch(80% 0.010 80);
    --ink3: oklch(68% 0.012 75);
    --ink5: oklch(52% 0.012 75);
    --rule: oklch(31% 0.014 75);
    --rule2: oklch(38% 0.014 75);
    --accent: oklch(70% 0.14 32);
    --accent-ink: oklch(18% 0.02 75);
    --derive: oklch(74% 0.10 252);
    --shadow: 0 4px 18px oklch(0% 0 0 / 0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* 顶栏 */
  .topbar {
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .spacer { flex: 1; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 7px 14px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: var(--ink3);
    font-size: 0.86rem;
    transition: all .18s ease;
  }
  .tab:hover { color: var(--ink); background: var(--bg2); }
  .tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .theme-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--rule);
    border-radius: 50%;
    background: transparent;
    color: var(--ink2);
    font-size: 1rem;
    display: grid; place-items: center;
  }
  .theme-btn:hover { border-color: var(--rule2); }

  /* 落地页 */
  .landing {
    max-width: 1040px;
    margin: 0 auto;
    padding: 48px 20px 72px;
  }
  .hero { text-align: center; margin-bottom: 48px; }
  .eyebrow {
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink5);
    margin-bottom: 14px;
  }
  .hero h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.12;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  .hero-sub { max-width: 40ch; margin: 0 auto; color: var(--ink5); font-size: 0.88rem; }

  .ident-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
    max-width: 720px;
    margin: 0 auto;
  }
  .ident {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    padding: 34px 28px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 16px;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  .ident:hover, .ident:focus-visible {
    border-color: var(--accent);
    box-shadow: var(--shadow);
    transform: translateY(-2px);
    outline: none;
  }
  .ident-kicker {
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink5);
  }
  .ident-name {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 2.2rem;
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  .ident-sub { font-size: 0.82rem; line-height: 1.6; color: var(--ink3); }
  .ident-go {
    margin-top: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--accent);
  }

  .note { text-align: center; color: var(--ink5); font-size: 0.82rem; margin-top: 28px; }

  /* iframe 壳 */
  .frame-wrap { height: calc(100vh - 56px); }
  iframe { width: 100%; height: 100%; border: none; display: block; background: var(--bg); }

  @media (max-width: 600px) {
    .topbar { padding: 0 12px; gap: 8px; }
    .brand { font-size: 0.95rem; }
    .tab { padding: 6px 10px; font-size: 0.78rem; }
    .landing { padding: 32px 14px 56px; }
    .ident-grid { grid-template-columns: 1fr; }
    .ident { padding: 26px 22px; }
    .ident-name { font-size: 1.8rem; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-home><span class="dot"></span><span>教育与心智 · 知识图谱</span></a>
    <div class="spacer"></div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-ident="educator">家长 · 老师</button>
      <button class="tab" data-ident="researcher">教育研究者</button>
    </nav>
    <button class="theme-btn" id="theme" aria-label="切换主题">◐</button>
  </header>

  <main id="main">
    <section class="landing" id="landing">
      <div class="hero">
        <span class="eyebrow">One hub · Two paths</span>
        <h1>一份知识库，两种用法</h1>
        <p class="hero-sub">选择入口开始，随时可在顶部切换。</p>
      </div>

      <div class="ident-grid">
        <button class="ident" data-ident="educator">
          <span class="ident-kicker">给家长与老师</span>
          <span class="ident-name">家长 · 老师</span>
          <span class="ident-sub">孩子这样，我该怎么办<br>按年龄分诊 · 课堂活动 · 一页纸带走</span>
          <span class="ident-go">进入 →</span>
        </button>
        <button class="ident" data-ident="researcher">
          <span class="ident-kicker">给教育研究者 · 学者</span>
          <span class="ident-name">教育研究者</span>
          <span class="ident-sub">检索 · 引用 · 数据<br>五大领域 454 条深度条目</span>
          <span class="ident-go">进入 →</span>
        </button>
      </div>

      <p class="note">身份不锁定，内容不复制。点击左上角品牌可随时返回此页。</p>
    </section>

    <div class="frame-wrap" id="frameWrap" hidden>
      <iframe id="frame" title="内容区" allow="clipboard-write"></iframe>
    </div>
  </main>

<script>
(function () {
  var frame = document.getElementById("frame");
  var frameWrap = document.getElementById("frameWrap");
  var landing = document.getElementById("landing");
  var tabs = document.getElementById("tabs");
  var IDENTS = ["educator", "researcher"];

  function identFromHash() {
    var h = location.hash.replace(/^#\/?/, "").trim();
    if (h === "parent" || h === "teacher") h = "educator"; // 向后兼容旧深链接
    return IDENTS.indexOf(h) > -1 ? h : "landing";
  }

  function render() {
    var next = identFromHash();

    var isLanding = next === "landing";
    landing.hidden = !isLanding;
    frameWrap.hidden = isLanding;

    // 顶栏 tab 高亮
    tabs.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("on", t.dataset.ident === next);
    });

    if (isLanding) {
      frame.removeAttribute("src");
    } else if (next === "researcher") {
      frame.src = "research/";
    } else {
      frame.src = "practice/";
    }
    window.scrollTo({ top: 0 });
  }

  function go(next) {
    var target = next === "landing" ? "#/" : "#/" + next;
    if (location.hash === target) { render(); return; }
    location.hash = target;
  }

  document.querySelectorAll("[data-ident]").forEach(function (el) {
    el.addEventListener("click", function () { go(el.dataset.ident); });
  });
  document.querySelectorAll("[data-home]").forEach(function (el) {
    el.addEventListener("click", function (e) { e.preventDefault(); go("landing"); });
  });
  window.addEventListener("hashchange", render);

  var themeBtn = document.getElementById("theme");
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = t === "dark" ? "☾" : "☀";
    try {
      localStorage.setItem("hub-theme", t);
      localStorage.setItem("atlas-theme", t); // 同步给 practice 子应用
      localStorage.setItem("edu-nav-theme", t); // 同步给 research 子应用
    } catch (e) {}
  }
  themeBtn.addEventListener("click", function () {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
  applyTheme(document.documentElement.getAttribute("data-theme"));

  render();
})();
</script>
</body>
</html>
