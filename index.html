<script>
  (function () {
    var s = null;
    try { s = localStorage.getItem("hub-theme"); } catch (e) {}
    var t = s === "dark" || s === "light" ? s : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();

<style>
  :root {
    --bg: oklch(97% 0.008 75);
    --bg2: oklch(94% 0.012 75);
    --paper: oklch(99% 0.004 85);
    --ink: oklch(20% 0.018 75);
    --ink2: oklch(36% 0.016 75);
    --ink3: oklch(46% 0.016 75);
    --ink5: oklch(58% 0.016 75);
    --rule: oklch(88% 0.016 75);
    --rule2: oklch(80% 0.016 75);
    --accent: oklch(44% 0.155 30);
    --accent-ink: oklch(99% 0.005 85);
    --accent-soft: oklch(94% 0.035 40);
    --derive: oklch(46% 0.11 252);
    --derive-soft: oklch(94% 0.025 250);
    --serif: "Fraunces", "Noto Serif SC", "Songti SC", Georgia, serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    --shadow: 0 8px 26px oklch(20% 0.02 75 / 0.10), 0 2px 6px oklch(20% 0.02 75 / 0.05);
    --shadow-sm: 0 2px 10px oklch(20% 0.02 75 / 0.06);
  }
  html[data-theme="dark"] {
    --bg: oklch(19% 0.010 75);
    --bg2: oklch(23% 0.012 75);
    --paper: oklch(26% 0.012 75);
    --ink: oklch(92% 0.008 85);
    --ink2: oklch(80% 0.010 80);
    --ink3: oklch(68% 0.012 75);
    --ink5: oklch(52% 0.012 75);
    --rule: oklch(31% 0.014 75);
    --rule2: oklch(38% 0.014 75);
    --accent: oklch(70% 0.14 32);
    --accent-ink: oklch(18% 0.02 75);
    --accent-soft: oklch(30% 0.05 35);
    --derive: oklch(74% 0.10 252);
    --derive-soft: oklch(28% 0.04 252);
    --shadow: 0 10px 30px oklch(0% 0 0 / 0.45);
    --shadow-sm: 0 2px 12px oklch(0% 0 0 / 0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* hidden 属性必须真正隐藏：作者样式的 display 会覆盖 UA 的 [hidden] 规则，
     这里用 !important 兜底（否则主页顶栏/卡片在切换后仍显示） */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  svg { display: block; }

  /* ===== 顶栏（仅在进入入口后显示；主页不显示导航栏） ===== */
  .topbar {
    height: 60px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    border-bottom: 1px solid var(--rule);
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .topbar[hidden] { display: none; }

  /* 圆形图标按钮：房子 / 分享 / 主题（44px 完美圆形，图标 22px 醒目） */
  .icon-round {
    width: 44px; height: 44px;
    flex: 0 0 44px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink2);
    display: grid; place-items: center;
    transition: border-color .18s ease, color .18s ease, background .18s ease, transform .18s ease;
  }
  .icon-round svg { width: 22px; height: 22px; }
  .icon-round:hover { color: var(--ink); border-color: var(--rule2); transform: translateY(-1px); }
  .icon-round:active { transform: scale(.96); }
  .icon-round:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 主题按钮：当前为浅色时显示月亮（点击入夜），深色时显示太阳 */
  .theme-btn { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--rule)); }
  .theme-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .theme-btn .ico-sun, .theme-btn .ico-moon { width: 23px; height: 23px; }
  html[data-theme="light"] .theme-btn .ico-sun { display: none; }
  html[data-theme="dark"] .theme-btn .ico-moon { display: none; }

  /* 中间分段式入口切换 */
  .tabs {
    flex: 1 1 auto;
    display: flex;
    justify-content: center;
    gap: 6px;
    min-width: 0;
  }
  .tab {
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid transparent;
    color: var(--ink3);
    font-size: 0.9rem;
    white-space: nowrap;
    transition: all .18s ease;
  }
  .tab:hover { color: var(--ink); background: var(--bg2); }
  .tab.on {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

  /* ===== 主页（无顶栏，独立的主题切换浮钮） ===== */
  .landing-theme {
    position: fixed;
    top: 16px; right: 16px;
    z-index: 40;
    box-shadow: var(--shadow-sm);
  }
  .landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 1000px;
    margin: 0 auto;
    padding: 76px 22px 72px;
  }
  .hero { text-align: center; margin-bottom: 44px; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink5);
    margin-bottom: 16px;
  }
  .eyebrow::before, .eyebrow::after {
    content: "";
    width: 26px; height: 1px;
    background: var(--rule2);
  }
  .hero h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(2.1rem, 5vw, 3.1rem);
    line-height: 1.12;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  .hero-sub { max-width: 42ch; margin: 0 auto; color: var(--ink5); font-size: 0.9rem; }

  .ident-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
  }
  .ident {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 30px 30px 26px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 20px;
    text-align: left;
    overflow: hidden;
    transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .ident::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 4px;
    background: var(--accent);
    opacity: .85;
  }
  .ident[data-ident="researcher"]::before { background: var(--derive); }
  .ident:hover, .ident:focus-visible {
    border-color: var(--accent);
    box-shadow: var(--shadow);
    transform: translateY(-4px);
    outline: none;
  }
  .ident[data-ident="researcher"]:hover, .ident[data-ident="researcher"]:focus-visible {
    border-color: var(--derive);
  }
  .ident-ico {
    width: 56px; height: 56px;
    border-radius: 16px;
    display: grid; place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    margin-bottom: 4px;
    transition: transform .2s ease;
  }
  .ident[data-ident="researcher"] .ident-ico { background: var(--derive-soft); color: var(--derive); }
  .ident:hover .ident-ico { transform: scale(1.06) rotate(-2deg); }
  .ident-ico svg { width: 28px; height: 28px; }
  .ident-kicker {
    font-size: 0.66rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink5);
  }
  .ident-name {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 2rem;
    line-height: 1.08;
    letter-spacing: -0.01em;
  }
  .ident-sub { font-size: 0.86rem; line-height: 1.65; color: var(--ink3); }
  .ident-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .ident-tags em {
    font-style: normal;
    font-size: 0.72rem;
    color: var(--ink3);
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: var(--bg);
  }
  .ident-go {
    margin-top: 12px;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .ident[data-ident="researcher"] .ident-go { color: var(--derive); }
  .ident-go svg { width: 15px; height: 15px; transition: transform .2s ease; }
  .ident:hover .ident-go svg { transform: translateX(3px); }

  .note { text-align: center; color: var(--ink5); font-size: 0.82rem; margin-top: 34px; }

  /* iframe 壳 */
  .frame-wrap { height: calc(100vh - 60px); height: calc(100dvh - 60px); }
  iframe { width: 100%; height: 100%; border: none; display: block; background: var(--bg); }

  /* 分享提示 */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 34px;
    transform: translate(-50%, 12px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 0.85rem;
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s ease, transform .2s ease, visibility .2s;
    z-index: 60;
    pointer-events: none;
    box-shadow: var(--shadow);
  }
  #toast.on { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

  @media (max-width: 720px) {
    .topbar { padding: 0 10px; gap: 8px; height: 56px; }
    .icon-round { width: 40px; height: 40px; flex-basis: 40px; }
    .icon-round svg { width: 20px; height: 20px; }
    .tab { padding: 8px 12px; font-size: 0.82rem; }
    .landing { padding: 60px 16px 56px; }
    .ident-grid { grid-template-columns: 1fr; gap: 16px; }
    .ident { padding: 24px 22px 22px; border-radius: 16px; }
    .ident-name { font-size: 1.7rem; }
    .frame-wrap { height: calc(100vh - 56px); height: calc(100dvh - 56px); }
  }
</style>

<script>
(function () {
  var frame = document.getElementById("frame");
  var frameWrap = document.getElementById("frameWrap");
  var landing = document.getElementById("landing");
  var topbar = document.getElementById("topbar");
  var tabs = document.getElementById("tabs");
  var themeBtns = [document.getElementById("theme"), document.getElementById("theme-landing")];
  var themeLanding = document.getElementById("theme-landing");
  var IDENTS = ["educator", "researcher"];
  var TOAST = document.getElementById("toast");
  var toastTimer = null;

  function toast(msg) {
    TOAST.textContent = msg;
    TOAST.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { TOAST.classList.remove("on"); }, 1900);
  }

  function identFromHash() {
    var h = location.hash.replace(/^#\/?/, "").trim();
    if (h === "parent" || h === "teacher") h = "educator";
    return IDENTS.indexOf(h) > -1 ? h : "landing";
  }

  function render() {
    var next = identFromHash();
    var isLanding = next === "landing";

    landing.hidden = !isLanding;
    frameWrap.hidden = isLanding;
    /* 主页不显示导航栏；进入入口后显示（房子 + 入口切换 + 分享 + 主题） */
    topbar.hidden = isLanding;
    /* 主页浮动主题按钮与顶栏主题按钮互斥：进入入口后隐藏，避免右上角出现两个重叠的按钮 */
    themeLanding.hidden = !isLanding;

    tabs.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("on", t.dataset.ident === next);
    });

    if (isLanding) {
      frame.removeAttribute("src");
    } else {
      /* embed=1：子应用隐藏自身品牌/分享/主题控件，避免与 hub 顶栏重复 */
      frame.src = (next === "researcher" ? "research/" : "practice/") + "?embed=1";
      pushTheme();
    }
    window.scrollTo({ top: 0 });
  }

  function go(next) {
    var target = next === "landing" ? "#/" : "#/" + next;
    if (location.hash === target) { render(); return; }
    location.hash = target;
  }

  document.querySelectorAll("[data-ident]").forEach(function (el) {
    el.addEventListener("click", function () { go(el.dataset.ident); });
  });
  document.querySelectorAll("[data-home]").forEach(function (el) {
    el.addEventListener("click", function (e) { e.preventDefault(); go("landing"); });
  });
  window.addEventListener("hashchange", render);

  /* ---- 主题：切到目标态（浅色显示月亮、深色显示太阳），并同步给两个子应用 ---- */
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try {
      localStorage.setItem("hub-theme", t);
      localStorage.setItem("atlas-theme", t);
      localStorage.setItem("edu-nav-theme", t);
    } catch (e) {}
    pushTheme();
  }
  function pushTheme() {
    try {
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ type: "theme", theme: document.documentElement.getAttribute("data-theme") }, "*");
      }
    } catch (e) {}
  }
  themeBtns.forEach(function (b) {
    if (!b) return;
    b.addEventListener("click", function () {
      applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });
  });
  /* iframe 加载完成后再推一次主题，避免子应用错过早于加载的 postMessage */
  frame.addEventListener("load", pushTheme);

  /* ---- 分享：优先系统分享面板，回退复制链接 ---- */
  document.getElementById("share").addEventListener("click", async function () {
    var url = location.href;
    var title = document.title;
    if (navigator.share) {
      try { await navigator.share({ title: title, url: url }); return; } catch (e) { if (e && e.name === "AbortError") return; }
    }
    try {
      await navigator.clipboard.writeText(url);
      toast("链接已复制，可直接分享");
    } catch (e) {
      var ta = document.createElement("textarea");
      ta.value = url;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); toast("链接已复制，可直接分享"); }
      catch (e2) { toast("复制失败，请手动复制地址栏链接"); }
      document.body.removeChild(ta);
    }
  });

  render();
  /* 首帧确定主题（localStorage 优先，默认浅色） */
  applyTheme(document.documentElement.getAttribute("data-theme") || "light");
})();
</script>
</body>
</html>
