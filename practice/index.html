    // 首屏即确定主题，避免闪烁；用户显式选择优先，默认浅色

      var stored = null;
      try { stored = localStorage.getItem("atlas-theme"); } catch (e) {}
      var t = stored === "dark" || stored === "light" ? stored : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
